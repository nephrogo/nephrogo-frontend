name: Continous integration for NepgroGo frontend
on:
  push:
    branches:
      - main

jobs:
  build_hugo:
    name: Build hugo
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: npm
          cache-dependency-path: theme-generator/package-lock.json

      - name: Install Gulp
        run: npm install gulp-cli -g

      - name: Install Node packages
        run: npm install
        working-directory: theme-generator

      - name: Gulp generate
        run: gulp dist
        working-directory: theme-generator

      - run: cp -a theme-generator/dist/assets/. static/

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.83.1'

      - name: Build LT
        run: hugo --minify --destination public/lt --config config-lt.toml

      - name: Build EN
        run: hugo --minify --destination public/en --config config-en.toml

      - name: Build DE
        run: hugo --minify --destination public/de --config config-de.toml

      - run: ls -la public/de
      - run: ls -la public/lt
      - run: ls -la public/en

      - uses: actions/upload-artifact@v4
        with:
          name: package-lock.json
          path: public/lt/package-lock.json