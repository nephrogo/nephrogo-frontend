name: Deploy production
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy-production:
    name: Build hugo
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    strategy:
      matrix:
        language: [ lt, en, de ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: theme-generator/package-lock.json

      - name: Install Node packages
        run: npm ci
        working-directory: theme-generator

      - name: Gulp generate
        run: npm run build
        working-directory: theme-generator

      - run: cp -a theme-generator/dist/assets/. static/

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.83.1'

      - name: Build ${{ matrix.language }}
        run: hugo --minify --destination public --config config-${{ matrix.language }}.toml

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=nephrogo-frontend --branch=${{ matrix.language }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.language }}-web
          path: public
