# Nutrients sector
- id: sectionNutritionTitle
  translation: "Personalizuota mitybos skaičiuoklė"
  
- id: sectionNutritionStatement1Title
  translation: "Įrašykite produktą"
- id: sectionNutritionStatement1Description
  translation: "Įrašykite suvalgytą produktą ir akimirksiu sužinosite, kiek suvartojote kalio, natrio, fosforo, baltymų, skysčių ir kilokalorijų."
- id: sectionNutritionStatement2Title
  translation: "Matykite dienos progresą"
- id: sectionNutritionStatement2Description
  translation: "NephroGo apskaičiuos, kiek ir kokių elektrolitų dar galite šiandien suvartoti, nepakenkdami inkstams."
- id: sectionNutritionStatement3Title
  translation: "Stebėkite savaitės dinamiką"
- id: sectionNutritionStatement3Description
  translation: "Stebėdami savaitės suvestines žinosite, ar pavyko laikytis taisyklingos inkstams palankios mitybos."
- id: sectionNutritionStatement4Title
  translation: "Kontroliuokite mitybą"
- id: sectionNutritionStatement4Description
  translation: "Su NephroGo kontroliuokite savo mitybą lengvai ir paprastai."

# Health indicators screen
- id: sectionHealthIndicatorsTitle
  translation: "Sveikatos rodikliai"
  
- id: sectionHealthIndicatorsStatement1Title
  translation: "Fiksuokite rodiklius"
- id: sectionHealthIndicatorsStatement1Description
  translation: "Fiksuokite patogiai kraujo spaudimą, svorį, šlapimo kiekį, gliukozės koncentraciją kraujyje, patinimus ir savijautą kasdien."
- id: sectionHealthIndicatorsStatement2Title
  translation: "Sekite dinamiką"
- id: sectionHealthIndicatorsStatement2Description
  translation: "Sekite savo sveikatos rodiklių dinamiką ir anksti pastebėsite reikšmingus pokyčius."
- id: sectionHealthIndicatorsStatement3Title
  translation: "Pastebėkite simptomus"
- id: sectionHealthIndicatorsStatement3Description
  translation: "Atpažinkite elektrolitų trūkumą arba perteklių, stebėdami simptomus."
- id: sectionHealthIndicatorsStatement4Title
  translation: "Išsaugokite duomenis"
- id: sectionHealthIndicatorsStatement4Description
  translation: "Išsaugokite kasdienius duomenis vienoje vietoje - padėsite gydytojui vizitų metu geriau suprasti ligos progresą ir kasdienę Jūsų savijautą."

# Peritoneal dialysis
- id: sectionPeritonealTitle
  translation: "Peritoninė dializė"
  
- id: sectionPeritonealStatement1Title
  translation: "Atlikite peritoninę dializę"
- id: sectionPeritonealStatement1Description
  translation: "NephroGo yra pritaikytas ir „rankinei“ ir automatinei peritoninei dializei."
- id: sectionPeritonealStatement2Title
  translation: "Sekite skysčių balansą"
- id: sectionPeritonealStatement2Description
  translation: "Įveskite dializės tirpalų duomenis, išgertų skysčių bei šlapimo kiekį ir NephroGo apskaičiuos skysčių balansą."
- id: sectionPeritonealStatement3Title
  translation: "Stebėkite sveikatos rodiklius"
- id: sectionPeritonealStatement3Description
  translation: "Prieš atlikdami dializę išsaugokite duomenis apie arterinį kraujo spaudimą, pulsą, kūno svorį, šlapimo kiekį."
- id: sectionPeritonealStatement4Title
  translation: "Gaukite suvestinę"
- id: sectionPeritonealStatement4Description
  translation: "NephroGo Jums paruoš dializės duomenų suvestinę, kuria lengvai galėsite pasidalinti su savo gydytoju."


